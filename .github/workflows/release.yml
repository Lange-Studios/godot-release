name: Godot Multi-Platform Release

on:
  workflow_dispatch:
    inputs:
      release_note:
        description: 'Optional note for this release'
        required: false
        type: string

jobs:
  # --- Linux & Windows Runner Jobs ---
  linux-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target: [linux-editor, windows-editor, linux-template, windows-template, android-template]
        precision: [single, double]
        dotnet: [true, false]
    name: Build ${{ matrix.target }} (${{ matrix.precision }}, dotnet-${{ matrix.dotnet }})
    steps:
      - uses: actions/checkout@v4
      - name: Build and Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin libwayland-dev wayland-protocols
          
          # Passing the new matrix properties as arguments to your custom script
          ./main.sh work build \
            --matrix-target "${{ matrix.target }}" \
            --precision "${{ matrix.precision }}" \
            --dotnet "${{ matrix.dotnet }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # Unique artifact name to prevent matrix overwrites
          name: ${{ matrix.target }}-${{ matrix.precision }}-dotnet-${{ matrix.dotnet }}
          path: gitignore/release
          retention-days: 1

      # This step ONLY runs for the linux-editor when dotnet is enabled
      - name: Upload GodotSharp
        if: matrix.target == 'linux-editor' && matrix.dotnet == true
        uses: actions/upload-artifact@v4
        with:
          name: GodotSharp-${{ matrix.precision }}
          path: gitignore/godot/bin/GodotSharp-${{ matrix.precision }}.zip
          retention-days: 1

  # --- macOS & iOS Runner Jobs ---
  apple-builds:
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        target: [macos-editor, macos-template, ios-template]
        precision: [single, double]
        dotnet: [true, false]
    name: Build ${{ matrix.target }} (${{ matrix.precision }}, dotnet-${{ matrix.dotnet }})
    steps:
      - uses: actions/checkout@v4

        # Available options here: https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md#xcode
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Build and Zip
        run: |
          ./main.sh work build \
            --matrix-target "${{ matrix.target }}" \
            --precision "${{ matrix.precision }}" \
            --dotnet "${{ matrix.dotnet }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # Unique artifact name to prevent matrix overwrites
          name: ${{ matrix.target }}-${{ matrix.precision }}-dotnet-${{ matrix.dotnet }}
          path: gitignore/release
          retention-days: 1

  # --- Final Release Job ---
  publish-release:
    runs-on: ubuntu-latest
    needs: [linux-builds, apple-builds] # Now waits for both matrices
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-binaries
          merge-multiple: true 

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Lange-Godot Release #${{ github.run_number }}"
          body: |
            ## Release Notes
            ${{ github.event.inputs.release_note }}
            
            **Build Details:**
            - Triggered by: ${{ github.actor }}
            - Workflow Run: ${{ github.run_id }}
          files: all-binaries/*
          generate_release_notes: true